server:
  port: 3001

spring:
  application:
    name: ideasy_server
  # 数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.2.100:3306/ideasy?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false
    username: root
    password: Libin704098.00
    # 连接池
    druid:
      initial-size: 5         # 初始连接数
      min-idle: 5             # 最小空闲连接
      max-active: 20          # 最大连接数
      max-wait: 60000         # 获取连接超时时间（毫秒）
      test-while-idle: true   # 空闲时检测连接有效性
      validation-query: SELECT 1  # 连接检测 SQL
      stat-view-servlet:
        # 是否启用StatViewServlet默认值true
        enabled: true
        # 访问路径为/druid时，跳转到StatViewServlet
        url-pattern: /druid/*
        # 是否能够重置数据
        reset-enable: false
        # 需要账号密码才能访问控制台，默认为root
        login-username: druid
        login-password: druid
        # IP白名单
        allow: 127.0.0.1
        # IP黑名单（共同存在时，deny优先于allow）
        deny:
  data:
    redis:
      host: 192.168.2.100
      port: 6379
      password: Libin704098.00
      # Redis数据库索引（默认为0）
      database: 0
      # 连接空闲超过N(s秒、ms毫秒，不加单位时使用毫秒)后关闭，0为禁用，这里配置值和tcp-keepalive值一致
      timeout: 60s
      # Lettuce连接池配置
      lettuce:
        pool:
          # 允许最大连接数，默认8（负值表示没有限制），推荐值：大于cpu * 2，通常为(cpu * 2) + 2
          max-active: 6
          # 最大空闲连接数，默认8，推荐值：cpu * 2
          max-idle: 4
          # 最小空闲连接数，默认0
          min-idle: 0
          # 连接用完时，新的请求等待时间(s秒、ms毫秒)，超过该时间抛出异常，默认-1（负值表示没有限制）
          max-wait: 5s

# 开启日志
logging:
  config: classpath:log4j2.xml
  level:
    root: INFO
    javax.activation: INFO
    org.apache.catalina: INFO
    org.apache.commons.beanutils.converters: INFO
    org.apache.coyote.http11.Http11Processor: INFO
    org.apache.http: INFO
    org.apache.tomcat: INFO
    org.springframework: INFO
    com.chinamobile.cmss.bdpaas.resource.monitor: DEBUG

# MyBatis
mybatis:
  mapper-locations: classpath:/mapper/*.xml # classpath: ==> resources/
  type-aliases-package: com.triable.ideasy_server.pojo # 包别名
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl # 控制台输出日志
